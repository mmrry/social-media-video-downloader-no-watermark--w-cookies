services:
  telegram-api-server:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"      # --local: загрузка по пути к файлу + лимит 2000 MB
      TELEGRAM_STAT: "1"
    volumes:
      # Данные сервера отдельно от загрузок бота
      - ./tg-api-data:/var/lib/telegram-bot-api
      # Тот же путь, что и в контейнере бота — file:///app/downloads/... должен существовать здесь
      - ./downloads:/app/downloads:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "9"
    networks:
      - botnet

  bot:
    build:
      context: .
      dockerfile: Dockerfile.python
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BOT_API_URL=http://telegram-api-server:8081
      - TELEGRAM_LOCAL_MODE=1
      - DOWNLOAD_DIR=/app/downloads
      - MAX_FILE_SIZE_MB=2000
    volumes:
      - ./downloads:/app/downloads
      - ./cookies.txt:/app/cookies.txt:ro
      # Опционально, для VK (раскомментировать + VK_COOKIES_FILE=/app/vk_cookies.txt в .env):
      # - ./vk_cookies.txt:/app/vk_cookies.txt:ro
    networks:
      - botnet
    depends_on:
      - telegram-api-server

networks:
  botnet:
    driver: bridge
